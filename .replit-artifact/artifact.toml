kind = "web"
previewPath = "/"
title = "FSRC Website"
version = "1.0.0"
id = "artifacts/fsrc-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24715
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/fsrc-website run dev"

[services.env]
PORT = "24715"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/fsrc-website", "run", "build"]
publicDir = "artifacts/fsrc-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

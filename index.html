<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04472B" />

    <!-- Primary SEO -->
    <title>FSRC — Evidence-Based Policy Intelligence</title>
    <meta name="description" content="FSRC (Five Senses Research Consultants) is an independent Canadian research and policy intelligence organization producing rigorous analysis on governance, human rights, artificial intelligence, and African futures." />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://fsrc.pro" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fsrc.pro" />
    <meta property="og:site_name" content="FSRC" />
    <meta property="og:title" content="FSRC — Evidence-Based Policy Intelligence" />
    <meta property="og:description" content="Independent research and policy intelligence on governance, human rights, AI, and African futures. FSRC transforms empirical evidence into strategic clarity for institutions that cannot afford to act on assumptions." />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:image" content="https://fsrc.pro/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FSRC — Evidence-Based Policy Intelligence" />
    <meta name="twitter:description" content="Independent research and policy intelligence on governance, human rights, AI, and African futures." />
    <meta name="twitter:image" content="https://fsrc.pro/opengraph.jpg" />

    <!-- Favicon / icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Font Performance: preconnect + single combined request for both typefaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
